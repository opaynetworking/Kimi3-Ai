<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        pre { position: relative; }
        pre .copy-btn { opacity: 0; transition: opacity 0.2s; }
        pre:hover .copy-btn { opacity: 1; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 flex-shrink-0">
        <h1 class="font-bold text-lg">AI Chat</h1>
        <button onclick="toggleSettings()" class="p-2 hover:bg-gray-100 rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <div id="settingsPanel" class="hidden bg-white border-b border-gray-200 p-4 space-y-3">
        <div>
            <label class="block text-sm font-medium mb-1">API Key</label>
            <input type="password" id="apiKey" class="w-full border border-gray-300 rounded-md p-2 text-sm" value="sk-UTKhp7ZOoasxx9AebzE39Q73TsvGG41xocOdl7uamidm1pnM">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Model</label>
            <input type="text" id="model" class="w-full border border-gray-300 rounded-md p-2 text-sm" value="moonshotai/kimi-k3-free">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">System Prompt</label>
            <textarea id="systemPrompt" rows="2" class="w-full border border-gray-300 rounded-md p-2 text-sm">You are a helpful assistant.</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Temperature: <span id="tempValue">0.7</span></label>
            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" class="w-full">
        </div>
        <div class="bg-yellow-50 border border-yellow-200 rounded-md p-3">
            <p class="text-xs text-yellow-800">
                <strong>Note:</strong> If you get CORS errors on local hosting, please deploy to Vercel (free) for a permanent solution.
            </p>
        </div>
        <button onclick="saveSettings()" class="w-full bg-blue-600 text-white py-2 rounded-md font-medium">Save Settings</button>
    </div>

    <div id="chatContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
        <div class="flex gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0">AI</div>
            <div class="flex-1">
                <div class="font-semibold text-sm mb-1">Assistant</div>
                <div class="bg-white rounded-lg p-3 border border-gray-200">
                    <p>Hello! How can I help you today?</p>
                </div>
            </div>
        </div>
    </div>

    <div class="border-t border-gray-200 bg-white p-3 flex-shrink-0">
        <div class="flex gap-2">
            <textarea id="messageInput" rows="1" class="flex-1 border border-gray-300 rounded-lg p-2 resize-none" placeholder="Type your message..." style="min-height: 40px; max-height: 120px;"></textarea>
            <button id="sendBtn" onclick="sendMessage()" class="bg-blue-600 text-white px-4 rounded-lg font-medium disabled:opacity-50">Send</button>
        </div>
    </div>

    <script>
        let messages = [];
        let isGenerating = false;

        const settings = {
            apiKey: 'sk-UTKhp7ZOoasxx9AebzE39Q73TsvGG41xocOdl7uamidm1pnM',
            endpoint: 'https://api.tokenrouter.com/v1/chat/completions',
            model: 'moonshotai/kimi-k3-free',
            systemPrompt: 'You are a helpful assistant.',
            temperature: 0.7
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                },
                langPrefix: 'hljs language-'
            });

            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('temperature').addEventListener('input', (e) => {
                document.getElementById('tempValue').textContent = e.target.value;
            });
        });

        function loadSettings() {
            const saved = localStorage.getItem('chat_settings');
            if (saved) {
                const s = JSON.parse(saved);
                settings.apiKey = s.apiKey || settings.apiKey;
                settings.model = s.model || settings.model;
                settings.systemPrompt = s.systemPrompt || settings.systemPrompt;
                settings.temperature = s.temperature || settings.temperature;
            }
            document.getElementById('apiKey').value = settings.apiKey;
            document.getElementById('model').value = settings.model;
            document.getElementById('systemPrompt').value = settings.systemPrompt;
            document.getElementById('temperature').value = settings.temperature;
            document.getElementById('tempValue').textContent = settings.temperature;
        }

        function saveSettings() {
            settings.apiKey = document.getElementById('apiKey').value.trim();
            settings.model = document.getElementById('model').value.trim();
            settings.systemPrompt = document.getElementById('systemPrompt').value.trim();
            settings.temperature = parseFloat(document.getElementById('temperature').value);
            
            localStorage.setItem('chat_settings', JSON.stringify(settings));
            alert('Settings saved!');
            toggleSettings();
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('hidden');
        }

        function appendMessage(role, content, isTemp = false) {
            const container = document.getElementById('chatContainer');
            const isUser = role === 'user';
            
            const div = document.createElement('div');
            div.className = 'flex gap-3';
            div.id = isTemp ? 'temp-message' : '';
            
            const avatar = isUser 
                ? '<div class="w-8 h-8 rounded-full bg-gray-400 flex items-center justify-center text-white font-bold text-sm flex-shrink-0">You</div>'
                : '<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0">AI</div>';
            
            const bubbleClass = isUser
                ? 'bg-blue-600 text-white rounded-lg'
                : 'bg-white rounded-lg border border-gray-200';

            const processedContent = isUser ? content.replace(/\n/g, '<br>') : renderMarkdown(content);

            div.innerHTML = `
                ${avatar}
                <div class="flex-1">
                    <div class="font-semibold text-sm mb-1">${isUser ? 'You' : 'Assistant'}</div>
                    <div class="p-3 ${bubbleClass}">${processedContent}</div>
                </div>
            `;
            
            if (isTemp) {
                const existing = document.getElementById('temp-message');
                if (existing) existing.remove();
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderMarkdown(text) {
            let html = marked.parse(text);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            tempDiv.querySelectorAll('pre').forEach(pre => {
                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute top-2 right-2 bg-gray-700 hover:bg-gray-600 text-white text-xs px-2 py-1 rounded';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                    navigator.clipboard.writeText(pre.querySelector('code').innerText);
                    btn.textContent = 'Copied!';
                    setTimeout(() => btn.textContent = 'Copy', 2000);
                };
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
            
            return tempDiv.innerHTML;
        }

        async function sendMessage() {
            if (isGenerating) return;
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (!settings.apiKey) {
                alert('Please enter your API Key in settings.');
                return;
            }

            messages.push({ role: 'user', content: text });
            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            
            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;
            appendMessage('assistant', '<div class="flex gap-1 items-center h-6"><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div></div>', true);

            try {
                const apiMessages = [];
                if (settings.systemPrompt) {
                    apiMessages.push({ 
                        role: 'system', 
                        content: [{ type: 'text', text: settings.systemPrompt }] 
                    });
                }
                messages.forEach(msg => {
                    apiMessages.push({ 
                        role: msg.role, 
                        content: [{ type: 'text', text: msg.content }] 
                    });
                });

                const payload = {
                    model: settings.model,
                    messages: apiMessages,
                    temperature: settings.temperature,
                    stream: false
                };

                // Try direct call first
                let response;
                try {
                    response = await fetch(settings.endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${settings.apiKey}`
                        },
                        body: JSON.stringify(payload)
                    });
                } catch (corsError) {
                    // If CORS fails, try with allorigins proxy
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(settings.endpoint)}`;
                    response = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${settings.apiKey}`,
                            'Origin': window.location.origin
                        },
                        body: JSON.stringify(payload)
                    });
                }

                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMsg = `Error ${response.status}`;
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMsg = errorData.error?.message || errorData.message || errorText;
                    } catch {
                        errorMsg = errorText || errorMsg;
                    }
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                const content = data.choices[0].message.content;
                messages.push({ role: 'assistant', content: content });
                appendMessage('assistant', content, true);

            } catch (error) {
                console.error(error);
                appendMessage('assistant', `<span class="text-red-600 font-semibold">Error: ${error.message}</span>`, true);
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
